  <!-- Document Lines -->
  <rect x="68" y="70" width="45" height="5" rx="2.5" fill="#38bdf8"/>
  <rect x="68" y="84" width="56" height="4" rx="2" fill="#64748b"/>
  <rect x="68" y="96" width="56" height="4" rx="2" fill="#64748b"/>
  <rect x="68" y="108" width="38" height="4" rx="2" fill="#64748b"/>
