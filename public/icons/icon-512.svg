<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="laser512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg512)"/>
  
  <!-- Viewfinder corners -->
  <path d="M 100 150 L 100 110 A 10 10 0 0 1 110 100 L 150 100" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 412 150 L 412 110 A 10 10 0 0 0 402 100 L 362 100" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 100 362 L 100 402 A 10 10 0 0 0 110 412 L 150 412" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 412 362 L 412 402 A 10 10 0 0 1 402 412 L 362 412" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Document Sheet -->
  <rect x="145" y="135" width="222" height="260" rx="18" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Document Lines -->
  <rect x="180" y="180" width="110" height="12" rx="6" fill="#38bdf8"/>
  <rect x="180" y="215" width="150" height="10" rx="5" fill="#64748b"/>
  <rect x="180" y="245" width="150" height="10" rx="5" fill="#64748b"/>
  <rect x="180" y="275" width="110" height="10" rx="5" fill="#64748b"/>
  <rect x="180" y="305" width="135" height="10" rx="5" fill="#64748b"/>
  <rect x="180" y="335" width="90" height="10" rx="5" fill="#64748b"/>

  <!-- Laser Beam -->
  <g filter="url(#glow)">
    <line x1="120" y1="240" x2="392" y2="240" stroke="url(#laser512)" stroke-width="8"/>
    <circle cx="256" cy="240" r="7" fill="#38bdf8"/>
  </g>
</svg>
